<!doctype html>
<html>
  <head>
    <title>Calendar</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #e5e5e5;
        font-family: Arial, sans-serif;
      }

      .calendar {
        width: 420px;
        background: white;
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        overflow: hidden;
      }

      .header {
        background: #2196f3;
        color: white;
        padding: 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .header h2 {
        margin: 0;
        font-size: 25px;
      }

      .header button {
        background: white;
        border: none;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        font-size: 20px;
        cursor: pointer;
      }

      .weekdays,
      .days {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        text-align: center;
      }

      .weekdays {
        background: #f2f2f2;
        font-weight: bold;
      }

      .weekdays div {
        padding: 12px 5px;
      }

      .days div {
        padding: 15px 5px;
        font-size: 17px;
        cursor: pointer;
      }

      .days div:hover {
        background: #e3f2fd;
        border-radius: 50%;
      }

      .today {
        background: #2196f3;
        color: white;
        border-radius: 50%;
        font-weight: bold;
      }

      .empty {
        cursor: default !important;
      }

      .empty:hover {
        background: none !important;
      }
    </style>
  </head>

  <body>
    <div class="calendar">
      <div class="header">
        <button onclick="previousMonth()">‹</button>

        <h2 id="monthYear"></h2>

        <button onclick="nextMonth()">›</button>
      </div>

      <div class="weekdays">
        <div>Sun</div>
        <div>Mon</div>
        <div>Tue</div>
        <div>Wed</div>
        <div>Thu</div>
        <div>Fri</div>
        <div>Sat</div>
      </div>

      <div class="days" id="calendarDays"></div>
    </div>

    <script>
      let currentDate = new Date();

      function displayCalendar() {
        let year = currentDate.getFullYear();
        let month = currentDate.getMonth();

        let monthNames = [
          "January",
          "February",
          "March",
          "April",
          "May",
          "June",
          "July",
          "August",
          "September",
          "October",
          "November",
          "December",
        ];

        document.getElementById("monthYear").innerHTML =
          monthNames[month] + " " + year;

        let firstDay = new Date(year, month, 1).getDay();

        let totalDays = new Date(year, month + 1, 0).getDate();

        let calendarDays = document.getElementById("calendarDays");

        calendarDays.innerHTML = "";

        // Empty spaces before first day
        for (let i = 0; i < firstDay; i++) {
          let empty = document.createElement("div");
          empty.classList.add("empty");
          calendarDays.appendChild(empty);
        }

        // Display days
        for (let day = 1; day <= totalDays; day++) {
          let dayElement = document.createElement("div");

          dayElement.innerHTML = day;

          // Highlight today's date
          let today = new Date();

          if (
            day === today.getDate() &&
            month === today.getMonth() &&
            year === today.getFullYear()
          ) {
            dayElement.classList.add("today");
          }

          calendarDays.appendChild(dayElement);
        }
      }

      function previousMonth() {
        currentDate.setMonth(currentDate.getMonth() - 1);
        displayCalendar();
      }

      function nextMonth() {
        currentDate.setMonth(currentDate.getMonth() + 1);
        displayCalendar();
      }

      displayCalendar();
    </script>
  </body>
</html>
