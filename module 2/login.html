<!doctype html>
<html>
  <head>
    <title>Student Login</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #2196f3, #6a11cb);
        font-family: Arial, sans-serif;
      }

      .login-box {
        width: 350px;
        background: white;
        padding: 35px;
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      }

      .login-box h1 {
        text-align: center;
        margin-bottom: 10px;
        color: #333;
      }

      .login-box p {
        text-align: center;
        color: #777;
        margin-bottom: 25px;
      }

      label {
        display: block;
        margin-bottom: 7px;
        font-weight: bold;
        color: #333;
      }

      input {
        width: 100%;
        padding: 12px;
        margin-bottom: 18px;
        border: 1px solid #ccc;
        border-radius: 8px;
        font-size: 16px;
      }

      input:focus {
        border-color: #2196f3;
        outline: none;
      }

      button {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
        margin-top: 5px;
      }

      .login {
        background: #2196f3;
        color: white;
      }

      .login:hover {
        background: #1976d2;
      }

      .clear {
        background: #ddd;
        color: #333;
      }

      .clear:hover {
        background: #bbb;
      }

      #message {
        text-align: center;
        margin-top: 15px;
        font-weight: bold;
      }
    </style>
  </head>

  <body>
    <div class="login-box">
      <h1>Student Login</h1>

      <p>Welcome! Please login to continue.</p>

      <form onsubmit="login(event)">
        <label>Student ID</label>
        <input type="text" id="studentId" placeholder="Enter Student ID" />

        <label>Password</label>
        <input type="password" id="password" placeholder="Enter Password" />

        <button type="submit" class="login">Login</button>

        <button type="button" class="clear" onclick="clearForm()">Clear</button>
      </form>

      <div id="message"></div>
    </div>

    <script>
      function login(event) {
        event.preventDefault();

        let studentId = document.getElementById("studentId").value;

        let password = document.getElementById("password").value;

        let message = document.getElementById("message");

        // Sample login details
        if (studentId === "student123" && password === "12345") {
          message.style.color = "green";
          message.innerHTML = "✓ Login Successful!";
        } else {
          message.style.color = "red";
          message.innerHTML = "✗ Invalid Student ID or Password";
        }
      }

      function clearForm() {
        document.getElementById("studentId").value = "";
        document.getElementById("password").value = "";
        document.getElementById("message").innerHTML = "";
      }
    </script>
  </body>
</html>
