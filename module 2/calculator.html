<!doctype html>
<html>
  <head>
    <title>Calculator</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #e5e5e5;
        font-family: Arial, sans-serif;
      }

      .calculator {
        width: 320px;
        background: #222;
        padding: 20px;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      }

      #display {
        width: 100%;
        height: 70px;
        margin-bottom: 20px;
        border: none;
        border-radius: 10px;
        background: #333;
        color: white;
        font-size: 32px;
        text-align: right;
        padding: 10px 15px;
        outline: none;
      }

      .buttons {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
      }

      button {
        height: 60px;
        border: none;
        border-radius: 12px;
        font-size: 22px;
        cursor: pointer;
        background: #444;
        color: white;
      }

      button:hover {
        background: #555;
      }

      .operator {
        background: #ff9500;
        color: white;
      }

      .operator:hover {
        background: #e68600;
      }

      .clear {
        background: #a5a5a5;
        color: black;
      }

      .clear:hover {
        background: #bdbdbd;
      }

      .equal {
        background: #ff9500;
      }

      .zero {
        grid-column: span 2;
      }
    </style>
  </head>

  <body>
    <div class="calculator">
      <input type="text" id="display" readonly />

      <div class="buttons">
        <button class="clear" onclick="clearDisplay()">AC</button>
        <button class="clear" onclick="deleteLast()">⌫</button>
        <button class="operator" onclick="addValue('%')">%</button>
        <button class="operator" onclick="addValue('/')">÷</button>

        <button onclick="addValue('7')">7</button>
        <button onclick="addValue('8')">8</button>
        <button onclick="addValue('9')">9</button>
        <button class="operator" onclick="addValue('*')">×</button>

        <button onclick="addValue('4')">4</button>
        <button onclick="addValue('5')">5</button>
        <button onclick="addValue('6')">6</button>
        <button class="operator" onclick="addValue('-')">−</button>

        <button onclick="addValue('1')">1</button>
        <button onclick="addValue('2')">2</button>
        <button onclick="addValue('3')">3</button>
        <button class="operator" onclick="addValue('+')">+</button>

        <button class="zero" onclick="addValue('0')">0</button>
        <button onclick="addValue('.')">.</button>
        <button class="equal" onclick="calculate()">=</button>
      </div>
    </div>

    <script>
      let display = document.getElementById("display");

      function addValue(value) {
        display.value += value;
      }

      function clearDisplay() {
        display.value = "";
      }

      function deleteLast() {
        display.value = display.value.slice(0, -1);
      }

      function calculate() {
        try {
          display.value = eval(display.value);
        } catch (error) {
          display.value = "Error";
        }
      }
    </script>
  </body>
</html>
