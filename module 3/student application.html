<!doctype html>
<html>
  <head>
    <title>Student Application Form</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #e8f0fe;
        padding: 30px;
      }

      .container {
        max-width: 750px;
        margin: auto;
        background: white;
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
      }

      h1 {
        text-align: center;
        color: #1565c0;
        margin-bottom: 5px;
      }

      .subtitle {
        text-align: center;
        color: #666;
        margin-bottom: 30px;
      }

      h2 {
        color: #1565c0;
        border-bottom: 2px solid #1565c0;
        padding-bottom: 8px;
      }

      .row {
        display: flex;
        gap: 20px;
      }

      .form-group {
        flex: 1;
        margin-bottom: 18px;
      }

      label {
        display: block;
        font-weight: bold;
        margin-bottom: 7px;
        color: #333;
      }

      input,
      select,
      textarea {
        width: 100%;
        padding: 11px;
        border: 1px solid #bbb;
        border-radius: 7px;
        font-size: 15px;
      }

      input:focus,
      select:focus,
      textarea:focus {
        outline: none;
        border-color: #1565c0;
      }

      textarea {
        height: 90px;
        resize: none;
      }

      .gender {
        display: flex;
        gap: 20px;
        padding-top: 8px;
      }

      .gender label {
        font-weight: normal;
      }

      .gender input {
        width: auto;
      }

      .buttons {
        display: flex;
        gap: 15px;
        margin-top: 20px;
      }

      button {
        flex: 1;
        padding: 13px;
        border: none;
        border-radius: 7px;
        font-size: 16px;
        cursor: pointer;
      }

      .submit {
        background: #1565c0;
        color: white;
      }

      .submit:hover {
        background: #0d47a1;
      }

      .clear {
        background: #ddd;
        color: #333;
      }

      .clear:hover {
        background: #bbb;
      }

      #message {
        text-align: center;
        margin-top: 20px;
        font-weight: bold;
        font-size: 17px;
      }

      @media (max-width: 600px) {
        .row {
          flex-direction: column;
          gap: 0;
        }

        body {
          padding: 10px;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>Student Application Form</h1>

      <p class="subtitle">Please fill in the details carefully</p>

      <form onsubmit="submitApplication(event)">
        <!-- Personal Information -->

        <h2>Personal Information</h2>

        <div class="row">
          <div class="form-group">
            <label>Full Name</label>

            <input
              type="text"
              id="name"
              placeholder="Enter full name"
              required
            />
          </div>

          <div class="form-group">
            <label>Date of Birth</label>

            <input type="date" id="dob" required />
          </div>
        </div>

        <div class="form-group">
          <label>Gender</label>

          <div class="gender">
            <label>
              <input type="radio" name="gender" value="Male" required />
              Male
            </label>

            <label>
              <input type="radio" name="gender" value="Female" />
              Female
            </label>

            <label>
              <input type="radio" name="gender" value="Other" />
              Other
            </label>
          </div>
        </div>

        <!-- Contact Information -->

        <h2>Contact Information</h2>

        <div class="row">
          <div class="form-group">
            <label>Email</label>

            <input type="email" id="email" placeholder="Enter email" required />
          </div>

          <div class="form-group">
            <label>Phone Number</label>

            <input
              type="tel"
              id="phone"
              placeholder="Enter phone number"
              required
            />
          </div>
        </div>

        <div class="form-group">
          <label>Address</label>

          <textarea
            id="address"
            placeholder="Enter your address"
            required
          ></textarea>
        </div>

        <!-- Academic Information -->

        <h2>Academic Information</h2>

        <div class="row">
          <div class="form-group">
            <label>Course</label>

            <select id="course" required>
              <option value="">Select Course</option>

              <option>Artificial Intelligence & Data Science</option>

              <option>Computer Science Engineering</option>

              <option>Information Technology</option>

              <option>Electronics & Communication</option>

              <option>Mechanical Engineering</option>
            </select>
          </div>

          <div class="form-group">
            <label>Year</label>

            <select id="year" required>
              <option value="">Select Year</option>

              <option>1st Year</option>
              <option>2nd Year</option>
              <option>3rd Year</option>
              <option>4th Year</option>
            </select>
          </div>
        </div>

        <div class="row">
          <div class="form-group">
            <label>12th / Diploma Percentage</label>

            <input
              type="number"
              id="percentage"
              placeholder="Enter percentage"
              min="0"
              max="100"
              required
            />
          </div>

          <div class="form-group">
            <label>Previous Institution</label>

            <input
              type="text"
              id="institution"
              placeholder="Enter institution name"
              required
            />
          </div>
        </div>

        <!-- Buttons -->

        <div class="buttons">
          <button type="submit" class="submit">Submit Application</button>

          <button type="button" class="clear" onclick="clearForm()">
            Clear
          </button>
        </div>
      </form>

      <div id="message"></div>
    </div>

    <script>
      function submitApplication(event) {
        event.preventDefault();

        let name = document.getElementById("name").value;

        let message = document.getElementById("message");

        message.style.color = "green";

        message.innerHTML =
          "✓ Application submitted successfully!<br>" +
          "Thank you, " +
          name +
          ".";
      }

      function clearForm() {
        document.querySelector("form").reset();

        document.getElementById("message").innerHTML = "";
      }
    </script>
  </body>
</html>
